[package]
name = "androscreen-settings"
description = "Desktop settings window for the AndroScreen secondary display"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "androscreen-settings"
path = "src/main.rs"

[dependencies]
androscreen-core = { path = "../core" }
libc.workspace = true
slint = { version = "1", default-features = false, features = [
    "std",
    "compat-1-18",
    "backend-winit",
    "renderer-software",
] }

[lints]
workspace = true
