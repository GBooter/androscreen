<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1A2E"/>
      <stop offset="1" stop-color="#1B2A46"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <!-- desktop monitor -->
  <rect x="20" y="34" width="56" height="38" rx="6" fill="none" stroke="url(#accent)" stroke-width="5"/>
  <rect x="36" y="78" width="24" height="5" rx="2.5" fill="#5EEAD4" opacity="0.85"/>
  <rect x="30" y="86" width="36" height="5" rx="2.5" fill="#A78BFA" opacity="0.55"/>
  <!-- phone acting as the second screen -->
  <rect x="78" y="30" width="30" height="68" rx="8" fill="url(#accent)" opacity="0.16"/>
  <rect x="78" y="30" width="30" height="68" rx="8" fill="none" stroke="url(#accent)" stroke-width="4.5"/>
  <rect x="88" y="36" width="10" height="3" rx="1.5" fill="#5EEAD4" opacity="0.9"/>
  <rect x="84" y="46" width="18" height="2.5" rx="1.25" fill="#F3F6FF" opacity="0.45"/>
  <rect x="84" y="53" width="18" height="2.5" rx="1.25" fill="#F3F6FF" opacity="0.35"/>
  <rect x="84" y="60" width="12" height="2.5" rx="1.25" fill="#F3F6FF" opacity="0.28"/>
</svg>
